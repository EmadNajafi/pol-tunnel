name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build Linux binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/pol-linux-$arch .
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/pol-linux-amd64 dist/pol-linux-arm64 \
            --repo "$GITHUB_REPOSITORY" --title "pol $TAG" \
            --notes "Reverse tunnel (tcp/tcpmux/ws/wsmux/wss/wssmux), spoof/spoofmux (UDP+ARQ, optional IP spoofing), and direct L3 mode (TUN + X25519 + AES-256-GCM). Linux amd64/arm64 attached." \
            || gh release upload "$TAG" dist/pol-linux-amd64 dist/pol-linux-arm64 --repo "$GITHUB_REPOSITORY" --clobber
