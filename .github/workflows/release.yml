name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # the newest stable Go: 1.22 no longer gets security fixes (crypto/tls, net/http)
          go-version: stable
      - name: Vet and test
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Build Linux binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/pol-linux-$arch .
          done
          # the installer too: github.com serves it where raw.githubusercontent.com is blocked
          cp install.sh dist/install.sh
          (cd dist && sha256sum pol-linux-amd64 pol-linux-arm64 install.sh > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/pol-linux-amd64 dist/pol-linux-arm64 dist/install.sh dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "pol $TAG" \
            --notes "Reverse tunnel (tcp/tcpmux/ws/wsmux/wss/wssmux), spoof/spoofmux (UDP+ARQ, optional IP spoofing), and direct L3 mode (TUN + X25519 + AES-256-GCM). Linux amd64/arm64 attached." \
            || gh release upload "$TAG" dist/pol-linux-amd64 dist/pol-linux-arm64 dist/install.sh dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
