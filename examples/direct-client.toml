# Direct mode (BackPack-style L3 tunnel) — CLIENT side (dials out).
[direct]
role = "client"
remote_addr = "SERVER_IP:3090"  # the server's real ip:port (paths > 1: this port and the next ones)
token = "CHANGE_ME"
tun_name = "pol0"
local_ip = "10.200.0.2"         # this side's tunnel IP (mirror of the server)
peer_ip  = "10.200.0.1"
mtu = 1400

carrier = "udp"                 # "udp" or "spoof"; each side chooses its own
# spoof_source = "10.10.10.10"  # carrier = "spoof": forge this source IP (then set spoof_peer_ip on the server)
paths = 1                       # SAME as the server
auto_mtu = true

log_level = "info"
